[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-procurement-ledger"
version = "0.1.0"
description = "Прототип прозрачного учёта поставок оборудования для школ"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
